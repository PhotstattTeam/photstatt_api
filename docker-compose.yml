# 本机开发用 Postgres。与 Homebrew 服务二选一，不要同时占用 5432。
# 使用：docker compose up -d
services:
  postgres:
    image: postgres:18-alpine
    container_name: photstatt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: photstatt
      POSTGRES_PASSWORD: photstatt_dev_pw
      POSTGRES_DB: photstatt
      TZ: Asia/Shanghai
    ports:
      - "5432:5432"
    volumes:
      # postgres:18 起数据目录在 /var/lib/postgresql/18/docker
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U photstatt -d photstatt"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
